<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PitchPro — Football Tournament Management</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#0fa863" />
  <meta name="description" content="Manage football tournaments, fixtures, results and live standings — mobile-first." />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192x192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PitchPro" />
  <script>
    // Apply saved theme before first paint to avoid a flash of the wrong colours.
    (function () {
      try {
        var p = localStorage.getItem('pitchpro-theme');
        var dark = p === 'dark' || ((p === 'system' || !p) && matchMedia('(prefers-color-scheme: dark)').matches);
        var r = document.documentElement;
        if (dark) r.classList.add('dark');
        r.style.colorScheme = dark ? 'dark' : 'light';
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
</head>
<body class="mat-typography">
  <app-root>
    <!-- Static skeleton shown until Angular bootstraps: keeps first paint fast on mobile -->
    <style>
      .boot-skeleton { display:flex; align-items:center; justify-content:center; height:100vh; background:#0f1720; color:#fff; font-family:'Inter',system-ui,sans-serif; }
    </style>
    <div class="boot-skeleton">Loading PitchPro…</div>
  </app-root>
  <noscript>You need to enable JavaScript to run this app.</noscript>
</body>
</html>
